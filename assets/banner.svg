<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d">
  <title id="t">claude-code-auto-approve</title>
  <desc id="d">A Claude Code session: npm test and an edit are auto-approved; rm -rf ~/projects and the plan approval wait for you.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
    .fg { fill: #ECE7E0; }
    .dim { fill: #8E877F; }
    .ok { fill: #7CC48A; }
    .wait { fill: #E08A6A; }
    .accent { fill: #D97757; }
    .ev { animation: rise .45s ease-out both; }
    .e1 { animation-delay: .3s; }
    .e2 { animation-delay: 1s; }
    .e3 { animation-delay: 1.7s; }
    .e4 { animation-delay: 2.4s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ev, .cursor { animation: none; } }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="958" height="458" rx="14" fill="#1F1D1B" stroke="#3B3835" stroke-width="1.5"/>
  <path d="M1 41 V15 A14 14 0 0 1 15 1 H945 A14 14 0 0 1 959 15 V41 Z" fill="#2A2825"/>
  <line x1="1" y1="41" x2="959" y2="41" stroke="#3B3835" stroke-width="1"/>
  <circle cx="26" cy="21" r="6" fill="#FF5F57"/>
  <circle cx="46" cy="21" r="6" fill="#FEBC2E"/>
  <circle cx="66" cy="21" r="6" fill="#28C840"/>
  <text x="480" y="26" text-anchor="middle" class="mono dim" font-size="13">claude  ~/project</text>

  <!-- welcome box -->
  <rect x="32" y="62" width="896" height="76" rx="9" fill="none" stroke="#D97757" stroke-width="1.5"/>
  <g transform="translate(60 100)" stroke="#D97757" stroke-width="2.6" stroke-linecap="round">
    <line x1="-9" y1="0" x2="9" y2="0"/>
    <line x1="0" y1="-9" x2="0" y2="9"/>
    <line x1="-6.4" y1="-6.4" x2="6.4" y2="6.4"/>
    <line x1="-6.4" y1="6.4" x2="6.4" y2="-6.4"/>
  </g>
  <text x="84" y="96" class="mono fg" font-size="19" font-weight="700">claude-code-auto-approve</text>
  <text x="84" y="121" class="mono dim" font-size="14">Routine permission prompts get approved. Risky ones wait for you.</text>

  <!-- event 1: approved -->
  <g class="ev e1">
    <circle cx="44" cy="179" r="5" fill="#7CC48A"/>
    <text x="60" y="184" class="mono fg" font-size="16"><tspan font-weight="700">Bash</tspan>(npm test)</text>
    <path d="M46 194 v10 h10" fill="none" stroke="#5E5852" stroke-width="1.5"/>
    <path d="M64 202 l4 4 l8 -9" fill="none" stroke="#7CC48A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="208" class="mono" font-size="14"><tspan class="ok">auto-approved</tspan><tspan class="dim" dx="10">routine command</tspan></text>
  </g>

  <!-- event 2: approved -->
  <g class="ev e2">
    <circle cx="44" cy="237" r="5" fill="#7CC48A"/>
    <text x="60" y="242" class="mono fg" font-size="16"><tspan font-weight="700">Edit</tspan>(src/app.py)</text>
    <path d="M46 252 v10 h10" fill="none" stroke="#5E5852" stroke-width="1.5"/>
    <path d="M64 260 l4 4 l8 -9" fill="none" stroke="#7CC48A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="266" class="mono" font-size="14"><tspan class="ok">auto-approved</tspan><tspan class="dim" dx="10">file edit</tspan></text>
  </g>

  <!-- event 3: waits -->
  <g class="ev e3">
    <circle cx="44" cy="295" r="5" fill="#E08A6A"/>
    <text x="60" y="300" class="mono fg" font-size="16"><tspan font-weight="700">Bash</tspan>(rm -rf ~/projects)</text>
    <path d="M46 310 v10 h10" fill="none" stroke="#5E5852" stroke-width="1.5"/>
    <rect x="65" y="315" width="3.4" height="11" rx="1" fill="#E08A6A"/>
    <rect x="71.6" y="315" width="3.4" height="11" rx="1" fill="#E08A6A"/>
    <text x="84" y="324" class="mono" font-size="14"><tspan class="wait">waiting for you</tspan><tspan class="dim" dx="10">dangerous delete: ~/projects</tspan></text>
  </g>

  <!-- event 4: waits -->
  <g class="ev e4">
    <circle cx="44" cy="353" r="5" fill="#E08A6A"/>
    <text x="60" y="358" class="mono fg" font-size="16"><tspan font-weight="700">ExitPlanMode</tspan></text>
    <path d="M46 368 v10 h10" fill="none" stroke="#5E5852" stroke-width="1.5"/>
    <rect x="65" y="373" width="3.4" height="11" rx="1" fill="#E08A6A"/>
    <rect x="71.6" y="373" width="3.4" height="11" rx="1" fill="#E08A6A"/>
    <text x="84" y="382" class="mono" font-size="14"><tspan class="wait">waiting for you</tspan><tspan class="dim" dx="10">plan approval is always yours</tspan></text>
  </g>

  <!-- prompt -->
  <line x1="32" y1="408" x2="928" y2="408" stroke="#3B3835" stroke-width="1"/>
  <text x="40" y="438" class="mono accent" font-size="17" font-weight="700">&gt;</text>
  <rect class="cursor" x="60" y="424" width="9" height="18" fill="#ECE7E0"/>
</svg>
